name: unigraph2
hidden_dim: 768
num_layers: 3
num_heads: 4
dropout: 0.2
num_experts: 8
num_selected_experts: 2

# supervised-only setting
use_reconstruction_loss: false
use_spd_loss: false
feat_drop_rate: 0.0
edge_mask_rate: 0.0
lambda_spd: 0.0

# inactive in supervised-only mode
gamma: 2.0
spd_k: 0
spd_num_sources: 0
spd_max_pairs: 0
spd_undirected: true
include_self_spd: false

